name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Type check
        run: bun run typecheck --if-present

      - name: Lint
        run: bun run lint --if-present

      - name: Test
        run: bun run test --if-present

      - name: Build
        run: bun run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Type check
        run: bun run typecheck --if-present

      - name: Lint
        run: bun run lint --if-present

      - name: Build
        run: bun run build